<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Editor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <aside id="toolbox">
        <section>
            <h2>Tools</h2>
            <div id="tools">
                <button data-tool="select" class="tool active" title="Select / Move (V)">◉ Select</button>
                <button data-tool="pan" class="tool" title="Pan / drag canvas (H)">✋ Pan</button>
                <button data-tool="rect" class="tool" title="Place square node (R)">▢ Square</button>
                <button data-tool="diamond" class="tool" title="Place diamond node (D)">◇ Diamond</button>
                <button data-tool="ellipse" class="tool" title="Place oval node (O)">◯ Oval</button>
                <button data-tool="edge" class="tool" title="Click a start node, click waypoints, click end node (E)">→ Edge</button>
            </div>
        </section>

        <section>
            <h2>Fill color</h2>
            <div id="swatches"></div>
        </section>

        <section>
            <h2>Subgraph</h2>
            <select id="node-ref" title="Link this node to another graph JSON file (9th tuple element). Select a node first.">
                <option value="">— none —</option>
            </select>
            <div class="row">
                <button id="btn-open-ref" title="Load the linked graph into the editor">↳ Open</button>
                <button id="btn-nav-back" title="Go back to the parent graph">↑ Back</button>
            </div>
        </section>

        <section>
            <h2>Docs</h2>
            <select id="node-md-file" title="Link this node to a markdown file">
                <option value="">— file —</option>
            </select>
            <select id="node-md-section" title="Link to a markdown section (10th tuple element = file#slug). Select a node first.">
                <option value="">— section —</option>
            </select>
            <div class="row">
                <button id="btn-open-md" title="Preview linked markdown section">📄 Open</button>
                <button id="btn-clear-md" title="Clear docs link">✕ Clear</button>
            </div>
        </section>

        <section>
            <h2>Actions</h2>
            <div id="actions">
                <button id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
                <button id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
                <button id="btn-del" title="Delete selected (Del)">🗑 Delete</button>
                <button id="btn-export" title="Export graph JSON">⬇ Export</button>
                <button id="btn-import" title="Load JSON from file">⬆ Import</button>
                <button id="btn-paste" title="Paste JSON from clipboard">⌨ Paste</button>
                <button id="btn-save" title="Save to imported file">💾 Save<span id="save-dirty" class="dirty-dot" hidden></span></button>
                <button id="btn-new" title="Clear canvas">✕ New</button>
            </div>
        </section>

        <section>
            <h2>Zoom</h2>
            <div class="row">
                <button id="zoom-out">−</button>
                <button id="zoom-in">＋</button>
                <button id="zoom-fit">Fit</button>
            </div>
        </section>

        <div id="status">Ready</div>
    </aside>

    <main id="canvas-wrap">
        <svg id="canvas">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                        markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
                </marker>
            </defs>
            <g id="viewport">
                <g id="edges"></g>
                <g id="nodes"></g>
                <g id="overlay"></g>
            </g>
        </svg>
        <textarea id="label-editor" placeholder="Node / edge text (Shift+Enter = new line)"></textarea>
        <div id="hint">V select · H pan · R/D/O shapes · E edge · dbl-click node/edge = text · wheel = zoom · middle-drag = pan</div>
    </main>

    <div id="modal" hidden>
        <div id="modal-box">
            <h2 id="modal-title">Export JSON</h2>
            <textarea id="modal-text" spellcheck="false"></textarea>
            <div class="row end">
                <button id="modal-copy">Copy</button>
                <button id="modal-download">Download</button>
                <button id="modal-import">Import</button>
                <button id="modal-close">Close</button>
            </div>
        </div>
    </div>

    <input type="file" id="file-input" accept=".json,application/json" hidden>
    <script type="module" src="/static/script/main.js?v=3"></script>
</body>
</html>
