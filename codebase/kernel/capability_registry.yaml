- {id: core.unit_registry, owner: kernel, inputs: [unit], outputs: [unit_state], event_triggers: [], status: PARTIALLY_ACTIVE, consumers: [digital_twins], note: twins ensure_unit lazy-imports UnitRegistry; Phase 2 live wiring}
