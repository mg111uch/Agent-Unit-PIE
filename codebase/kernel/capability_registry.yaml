# capability_registry.yaml — Phase 0 activation registry (read-only, no behavior change).
# Method (2026-09-15): one entry per .py under codebase/kernel/ (66 files).
# Status evidence: rg "from kernel\.|import kernel" over codebase/ + scripts/ (kernel-internal excluded).
# ACTIVE = hot research-loop path; PARTIALLY_ACTIVE = >=1 external importer but peripheral;
# DORMANT = zero external importers, tests-only, or 0-line stub. inputs/outputs best-effort (tbd = unknown).
# Consumers key: research_loop, agent_loop, argu_god, stock_analyser, simulators, ops_tooling.
- {id: core.package_init, owner: kernel, inputs: [tbd], outputs: [tbd], event_triggers: [], status: DORMANT, consumers: []}
- {id: core.compression_engine, owner: kernel, inputs: [observations, patterns], outputs: [consolidated_view], event_triggers: [consolidation_requested], status: ACTIVE, consumers: [research_loop]}
- {id: core.context_builder, owner: kernel, inputs: [tbd], outputs: [llm_context], event_triggers: [], status: DORMANT, consumers: []}
- {id: core.git_version, owner: kernel, inputs: [sim_id], outputs: [commit, version_meta], event_triggers: [], status: ACTIVE, consumers: [research_loop, stock_analyser, digital_twins]}
- {id: core.observation_pipeline, owner: kernel, inputs: [raw_observation], outputs: [observation], event_triggers: [observation_received], status: PARTIALLY_ACTIVE, consumers: [kernel_bus], note: bus uses normalize; popula_dyn event_bridge injectable seam remains}
- {id: core.ontology_registry, owner: kernel, inputs: [ontology_query], outputs: [ontology_entry], event_triggers: [], status: PARTIALLY_ACTIVE, consumers: [agent_loop]}
- {id: core.simulation_version, owner: kernel, inputs: [sim_id, code_state], outputs: [version_id, lineage], event_triggers: [code_changed], status: ACTIVE, consumers: [research_loop, simulators]}
