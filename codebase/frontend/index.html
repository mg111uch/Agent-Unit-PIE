<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Coding Agent</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-zinc-950 text-zinc-100">
<div id="app" class="flex h-screen flex-col">
  <agent-header></agent-header>
  <div class="flex min-h-0 flex-1">
    <aside class="shrink-0 border-r border-zinc-800 min-h-0" :style="{ width: store.treeWidth + 'px' }">
      <file-tree></file-tree>
    </aside>
    <div @mousedown="store.startResize('left', $event)"
      class="shrink-0 w-1 cursor-col-resize bg-zinc-800/40 hover:bg-sky-500/60 transition-colors"></div>
    <main class="flex-1 min-w-0 min-h-0">
      <code-editor></code-editor>
    </main>
    <div @mousedown="store.startResize('right', $event)"
      class="shrink-0 w-1 cursor-col-resize bg-zinc-800/40 hover:bg-sky-500/60 transition-colors"></div>
    <aside class="shrink-0 border-l border-zinc-800 flex flex-col min-h-0" :style="{ width: store.chatWidth + 'px' }">
      <div class="min-h-0 flex-1">
        <agent-chat></agent-chat>
      </div>
      <agent-input></agent-input>
    </aside>
  </div>
</div>

<!-- Templates -->
<template id="file-tree-tmpl">
  <div class="flex flex-col h-full min-h-0">
    <div class="px-3 py-2 border-b border-zinc-800/80 flex items-center gap-2 shrink-0">
      <span class="text-[10px] font-medium uppercase tracking-wider text-zinc-500 flex-1">Files</span>
      <button @click="newFile" title="New file" class="text-zinc-500 hover:text-zinc-300 text-sm leading-none">+</button>
      <button @click="refresh" title="Refresh" class="text-zinc-500 hover:text-zinc-300 text-xs">⟳</button>
    </div>
    <div class="px-2 py-2 shrink-0">
      <input v-model="filter" placeholder="Filter files..." class="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-200 outline-none focus:border-sky-500/50"/>
    </div>
    <p v-if="error" class="px-3 py-2 text-[11px] text-red-400 break-safe shrink-0">{{ error }}</p>
    <div ref="listRef" class="flex-1 min-h-0 overflow-y-auto pb-3 text-xs font-mono">
      <div v-for="row in visibleRows" :key="row.path" @click="click(row)"
        @contextmenu.prevent="openMenu(row, $event)"
        :data-path="row.path"
        class="w-full flex items-center pr-1 cursor-pointer select-none"
        :class="isActive(row.path) ? 'bg-sky-500/15 text-sky-300' : 'text-zinc-400 hover:bg-zinc-800/60'"
        :style="{ paddingLeft: (8 + row.depth * 12) + 'px' }">
        <span class="flex-1 min-w-0 truncate py-0.5">
          <span class="inline-block w-3 text-zinc-600">{{ row.type === 'dir' ? (expanded[row.path] ? '▾' : '▸') : '' }}</span>{{ row.name || row.path }}
        </span>
      </div>
    </div>
    <teleport to="body">
      <div v-if="menu.open" class="ft-context-menu fixed z-50 w-44 rounded-lg border border-zinc-700/80 bg-zinc-900/95 shadow-xl shadow-black/50 py-1 text-xs"
        :style="{ left: menu.x + 'px', top: menu.y + 'px' }">
        <p class="px-3 py-1 text-[10px] text-zinc-500 truncate border-b border-zinc-800/80 mb-1">{{ menu.row && (menu.row.name || menu.row.path) }}</p>
        <button @click="menuCopyPath" class="w-full text-left px-3 py-1.5 text-zinc-300 hover:bg-zinc-800 transition-colors">Copy Path</button>
        <button @click="menuReveal" class="w-full text-left px-3 py-1.5 text-zinc-300 hover:bg-zinc-800 transition-colors">{{ menu.row && menu.row.type === 'dir' ? 'Open Folder' : 'Open Containing Folder' }}</button>
        <div class="my-1 border-t border-zinc-800/80"></div>
        <button @click="menuRename" class="w-full text-left px-3 py-1.5 text-zinc-300 hover:bg-zinc-800 transition-colors">Rename</button>
        <button @click="menuDelete" class="w-full text-left px-3 py-1.5 text-red-400 hover:bg-red-500/10 transition-colors">Delete</button>
      </div>
    </teleport>
  </div>
</template>

<template id="code-editor-tmpl">
  <div class="flex flex-col h-full min-h-0">
    <div class="h-10 shrink-0 border-b border-zinc-800/80 flex items-stretch bg-zinc-950">
      <div class="flex-1 min-w-0 flex items-stretch overflow-x-auto">
        <div v-for="tab in store.tabs" :key="tab.path" @click="store.activateTab(tab.path)"
          :title="tab.path"
          class="group flex items-center gap-1.5 px-3 text-xs border-r border-zinc-800/60 cursor-pointer max-w-[14rem] shrink-0 transition-colors"
          :class="tab.path === store.activeFile ? 'bg-zinc-900 text-zinc-100' : 'text-zinc-500 hover:text-zinc-300 hover:bg-zinc-900/40'">
          <span class="truncate">{{ tabName(tab.path) }}</span>
          <span v-if="tab.dirty" class="text-amber-400">●</span>
          <button @click="close($event, tab.path)" title="Close"
            class="ml-1 w-4 h-4 flex items-center justify-center rounded text-zinc-600 hover:text-zinc-100 hover:bg-zinc-700/60">×</button>
        </div>
        <span v-if="!store.tabs.length" class="flex items-center px-3 text-xs text-zinc-600">No file open</span>
      </div>
      <div class="flex items-center gap-2 px-3 shrink-0 border-l border-zinc-800/60">
        <span class="text-[10px] uppercase tracking-wider text-zinc-600">{{ language }}</span>
        <button v-if="store.activeFile" @click="store.saveFile()" :disabled="!store.editorDirty || store.saving"
          class="text-xs px-2 py-1 rounded transition-colors"
          :class="store.editorDirty && !store.saving ? 'bg-sky-600 hover:bg-sky-500 text-white' : 'bg-zinc-800 text-zinc-500 cursor-not-allowed'">
          {{ store.saving ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </div>
    <p v-if="store.editorError" class="px-3 py-2 text-xs text-red-400 border-b border-red-500/20 bg-red-500/10 break-safe shrink-0">{{ store.editorError }}</p>
    <div class="flex-1 min-h-0 relative">
      <div v-show="store.activeFile" ref="hostRef" class="absolute inset-0"></div>
      <div v-if="!store.activeFile" class="flex h-full items-center justify-center text-sm text-zinc-600">Select a file to edit</div>
    </div>
  </div>
</template>

<template id="agent-header-tmpl">
  <header class="relative z-30 border-b border-zinc-800/80 bg-zinc-950/95 backdrop-blur-md shrink-0">
    <div class="mx-auto max-w-3xl flex items-center justify-between h-12 px-4">
      <div class="flex items-center gap-2">
        <span :class="['connection-led', store.connected ? 'connected' : 'disconnected']"></span>
        <h1 class="text-sm font-medium">Unit-PIE</h1>
      </div>
      <div class="flex items-center gap-1">
        <div class="relative model-menu">
          <button @click="toggle" class="flex items-center gap-1.5 text-xs text-zinc-400 hover:text-zinc-200 transition-colors px-2 py-1 rounded-lg hover:bg-zinc-800/50">
            <span v-if="catalog.active" class="truncate max-w-[11rem]">{{ catalog.active.provider }} · {{ catalog.active.model }}</span>
            <span v-else>loading...</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
          <div v-if="open" class="absolute right-0 top-full mt-1 w-60 rounded-xl border border-zinc-700/80 bg-zinc-900/95 shadow-xl shadow-black/40 z-20 max-h-72 overflow-y-auto">
            <div class="sticky top-0 bg-zinc-900/95 px-3 py-2 text-[10px] font-medium uppercase tracking-wider text-zinc-500 border-b border-zinc-800">Model</div>
            <div v-if="noProviders" class="px-3 py-4 text-xs text-zinc-500 text-center">No providers registered</div>
            <div v-for="(entry, name) in providerList" :key="name">
              <div class="px-3 pt-2 pb-1 text-[10px] font-medium uppercase tracking-wider text-zinc-500">{{ name }}</div>
              <button v-for="m in entry.models" :key="m" @click="switchModel(name, m)"
                class="w-full text-left px-3 py-1.5 text-xs flex items-center gap-2 hover:bg-zinc-800 transition-colors"
                :class="isActive(name, m) ? 'text-zinc-100' : 'text-zinc-400'"
                :disabled="!canChange">
                <span class="w-1.5 h-1.5 rounded-full" :class="isActive(name, m) ? 'bg-sky-400' : 'bg-transparent'"></span>
                {{ m }}
              </button>
            </div>
          </div>
          <p v-if="switchError" class="absolute right-0 top-full mt-1 text-xs text-red-400 whitespace-nowrap">{{ switchError }}</p>
        </div>
        <div class="relative settings-menu">
          <button @click="toggleSettings" title="Settings"
            class="flex items-center justify-center w-7 h-7 rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
          <div v-if="settingsOpen" class="absolute right-0 top-full mt-1 w-60 rounded-xl border border-zinc-700/80 bg-zinc-900/95 shadow-xl shadow-black/40 z-20">
            <div class="px-3 py-2 text-[10px] font-medium uppercase tracking-wider text-zinc-500 border-b border-zinc-800">Editor</div>
            <button @click="store.toggleWordWrap()" class="w-full flex items-center justify-between px-3 py-2 text-xs text-zinc-300 hover:bg-zinc-800/60 transition-colors">
              <span>Word wrap</span>
              <span class="w-8 h-4 rounded-full transition-colors relative" :class="store.wordWrap ? 'bg-sky-500' : 'bg-zinc-700'">
                <span class="absolute top-0.5 w-3 h-3 rounded-full bg-white transition-all" :class="store.wordWrap ? 'left-4' : 'left-0.5'"></span>
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>
</template>

<template id="agent-chat-tmpl">
  <div ref="scrollRef" class="h-full overflow-y-auto">
    <div class="mx-auto max-w-3xl px-4">
      <!-- Error banner -->
      <div v-if="store.error" class="mt-2 rounded-lg bg-red-500/10 border border-red-500/20 px-4 py-3">
        <p class="text-sm text-red-400">{{ store.error }}</p>
      </div>

      <!-- Empty state -->
      <div v-if="store.messages.length === 0" class="flex flex-col items-center justify-center h-full min-h-[60vh]">
        <svg class="w-12 h-12 text-zinc-700 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.25 6.75L22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3l-4.5 16.5"></path></svg>
        <h2 class="text-lg font-medium text-zinc-300 mb-2">What should we work on?</h2>
        <p class="text-sm text-zinc-500 mb-6">Describe a coding task or ask a question</p>
        <div class="flex flex-wrap gap-2 justify-center max-w-md">
          <button v-for="s in suggestions" :key="s" @click="send(s)" class="px-4 py-2 rounded-full border border-zinc-700/60 text-xs text-zinc-300 hover:border-zinc-500 hover:bg-zinc-800/50 transition-colors">{{ s }}</button>
        </div>
      </div>

      <!-- Messages -->
      <div v-for="msg in store.messages" :key="msg.id" class="py-3" :class="msg.role === 'user' ? '' : 'mb-4'">
        <!-- User message -->
        <div v-if="msg.role === 'user'" class="flex justify-end">
          <div class="bg-sky-600/15 rounded-2xl px-4 py-2.5 max-w-[85%]">
            <p class="text-sm leading-relaxed whitespace-pre-wrap break-safe">{{ msg.content }}</p>
            <copy-button :text="msg.content" :tool-calls="msg.toolCalls"></copy-button>
          </div>
        </div>
        <!-- Assistant message -->
        <div v-else>
          <!-- Tool calls -->
          <div v-if="msg.toolCalls && msg.toolCalls.length">
            <div v-for="group in groupedToolCalls(msg.toolCalls)" :key="group.step">
              <div v-if="group.parallel" class="text-xs text-amber-400 mb-1.5">⚡{{ group.count }} parallel calls</div>
              <tool-call-card v-for="tc in group.calls" :key="tc.callId || tc.step" :tool-call="tc" :parallel="group.parallel"></tool-call-card>
            </div>
          </div>
          <!-- Content -->
          <div v-if="msg.content" class="text-sm leading-relaxed break-safe markdown-body" v-html="renderMarkdown(msg.content)"></div><span v-if="msg.isStreaming && !msg.isThinking" class="stream-cursor"></span>
          <p v-else-if="msg.pendingQuestion" class="text-sm text-sky-400">Answer the question below<span class="thinking-dots"></span></p>
          <p v-else-if="msg.isThinking" class="text-sm text-zinc-500 italic">Thinking<span class="thinking-dots"></span></p>
          <div class="flex items-center justify-between mt-1">
            <div v-if="!msg.isStreaming && (msg.usage || msg.latency != null || msg.totalSteps)" class="flex flex-wrap gap-x-4 gap-y-0.5 text-[11px] text-zinc-600">
              <span v-if="msg.totalSteps">{{ msg.totalSteps }} step{{ msg.totalSteps > 1 ? 's' : '' }}</span>
              <span v-if="msg.latency != null">{{ msg.latency.toFixed(1) }}s</span>
              <span v-if="msg.usage && msg.usage.total_tokens">{{ formatTokens(msg.usage.total_tokens) }} tok</span>
              <span v-if="msg.usage && msg.usage.estimated_cost">{{ formatCost(msg.usage.estimated_cost) }}</span>
              <span v-if="msg.cacheHits != null">cache {{ msg.cacheHits }} hit{{ msg.cacheHits !== 1 ? 's' : '' }}, {{ msg.cacheMisses }} miss{{ msg.cacheMisses !== 1 ? 'es' : '' }}</span>
              <span v-if="msg.retries" class="text-amber-500">{{ msg.retries }} retr{{ msg.retries > 1 ? 'ies' : 'y' }}</span>
            </div>
            <copy-button v-if="msg.content" :text="msg.content" :tool-calls="msg.toolCalls"></copy-button>
          </div>
        </div>
      </div>

      <!-- Tools running -->
      <div v-if="store.pendingToolCount > 0" class="flex items-center gap-2 py-2 text-xs text-amber-400">
        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        Running tool{{ store.pendingToolCount > 1 ? 's' : '' }}...
      </div>

      <!-- Question panel -->
      <question-panel v-if="store.pendingQuestions" :questions="store.pendingQuestions" @submit="onQuestionSubmit"></question-panel>

      <div ref="anchorRef"></div>
    </div>
  </div>
</template>

<template id="tool-call-card-tmpl">
  <div v-if="toolCall" class="rounded-lg border mb-2 overflow-hidden"
    :class="toolCall.ok === false ? 'border-red-500/40 bg-red-900/20' : parallel ? 'border-yellow-500/50 bg-zinc-900/50' : 'border-zinc-700/60 bg-zinc-900/50'">
    <div class="w-full flex items-center px-3 py-2 text-xs"
      :class="toolCall.ok === false ? 'text-red-300' : 'text-zinc-300'">
      <button @click="primary" class="flex-1 min-w-0 text-left flex items-center gap-2 hover:text-sky-300 transition-colors"
        :title="target ? 'Open ' + target.path + ':' + target.line : ''">
        <span class="font-mono shrink-0">{{ toolCall.tool }}</span>
        <span v-if="target" class="text-[10px] text-zinc-500 truncate">{{ target.path }}<span v-if="target.line > 1">:{{ target.line }}</span></span>
      </button>
      <span v-if="toolCall.ok === false" class="text-[10px] text-red-400 mr-2 shrink-0">FAILED</span>
      <span v-if="showUsage()" class="text-[10px] text-emerald-400 mr-2 shrink-0">{{ formatTokens(toolCall.usage.total_tokens) }} tok</span>
      <button @click="expanded = !expanded" class="p-1 -mr-1 shrink-0 text-zinc-500 hover:text-zinc-200 transition-colors" title="Details">
        <svg class="w-3.5 h-3.5 transition-transform" :class="expanded ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
      </button>
    </div>
    <div v-show="expanded" class="border-t border-zinc-800 px-3 py-2 space-y-2">
      <div>
        <p class="text-[10px] font-medium uppercase tracking-wider text-zinc-500 mb-1">Input</p>
        <pre class="text-xs text-zinc-400 bg-zinc-950 rounded p-2 overflow-x-auto break-safe">{{ formatInput(toolCall.input) }}</pre>
      </div>
      <div v-if="toolCall.result">
        <p class="text-[10px] font-medium uppercase tracking-wider mb-1"
          :class="toolCall.ok === false ? 'text-red-400' : 'text-zinc-500'">Result</p>
        <div class="text-xs markdown-body bg-zinc-950 rounded p-2 overflow-y-auto max-h-48"
          :class="toolCall.ok === false ? 'text-red-300' : ''" v-html="renderResult(toolCall.result)"></div>
      </div>
    </div>
  </div>
</template>

<template id="copy-button-tmpl">
  <div class="flex justify-end mt-1">
    <button @click="copy" class="text-[10px] text-zinc-600 hover:text-zinc-400 transition-colors">
      <span v-if="copied" class="text-emerald-400">✓ Copied</span>
      <span v-else>Copy</span>
    </button>
  </div>
</template>

<template id="question-panel-tmpl">
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60">
    <div class="w-full max-w-md mx-4 rounded-xl border border-zinc-700/80 bg-zinc-900 p-4 shadow-2xl">
      <div v-if="questions.length > 1" class="flex items-center gap-2 mb-3">
        <span class="text-[10px] text-zinc-500">Question {{ currentIndex + 1 }} of {{ questions.length }}</span>
        <div class="flex gap-1">
          <span v-for="(_, i) in questions" :key="i" class="w-2 h-2 rounded-full"
            :class="i === currentIndex ? 'bg-sky-500' : i < currentIndex ? 'bg-sky-500/40' : 'bg-zinc-700'"></span>
        </div>
      </div>
      <span v-if="current.header" class="text-[10px] font-medium uppercase tracking-wider text-sky-400 block mb-1">{{ current.header }}</span>
      <p class="text-sm text-zinc-200 mb-3">{{ current.question }}</p>
      <div v-if="current.options && !customMode[currentIndex]" class="flex flex-col gap-2 mb-3">
        <button v-for="(opt, i) in current.options" :key="i" @click="selectOption(opt)"
          class="px-3 py-2 rounded-lg border text-xs text-left transition-colors"
          :class="answers[currentIndex] === optLabel(opt) ? 'border-sky-500 bg-sky-500/10 text-sky-300' : 'border-zinc-700 text-zinc-400 hover:border-zinc-500'">
          <span>{{ optLabel(opt) }}</span>
          <span v-if="optDescription(opt)" class="block text-[10px] opacity-70 mt-0.5">{{ optDescription(opt) }}</span>
        </button>
      </div>
      <button @click="toggleCustom" class="text-xs text-zinc-500 hover:text-zinc-300 mb-2 block">
        {{ customMode[currentIndex] ? 'Pick an option' : 'Custom answer...' }}
      </button>
      <textarea v-if="customMode[currentIndex]" v-model="customVal" rows="2" class="w-full text-xs bg-zinc-950 border border-zinc-700 rounded-lg p-2 text-zinc-200 resize-none mb-3"></textarea>
      <button @click="submit" :disabled="!canSubmit"
        class="w-full py-2 rounded-lg text-sm font-medium transition-colors"
        :class="canSubmit ? 'bg-sky-600 hover:bg-sky-500 text-white' : 'bg-zinc-700 text-zinc-500 cursor-not-allowed'">
        {{ currentIndex < questions.length - 1 ? 'Next Question' : 'Send Answer' }}
      </button>
    </div>
  </div>
</template>

<template id="agent-input-tmpl">
  <div class="shrink-0 bg-zinc-950/95 pb-4">
    <div class="h-0.5 w-full bg-zinc-800/60 shrink-0">
      <div class="h-full bg-sky-500/80 transition-all duration-500" :style="{ width: tokenLinePct }"></div>
    </div>
    <div class="mx-auto max-w-3xl px-4 pt-3">
      <form @submit.prevent="submit" class="relative">
        <div class="relative rounded-2xl border border-zinc-700/60 focus-within:border-sky-500/50 focus-within:ring-1 focus-within:ring-sky-500/30 bg-zinc-900/90">
          <div class="absolute inset-0 px-4 py-3 text-sm whitespace-pre-wrap break-words pointer-events-none overflow-y-auto max-h-40" v-html="highlightInput()"></div>
          <textarea ref="taRef" v-model="input" @keydown="onKeydown" @input="onInput" @scroll="syncScroll"
            placeholder="/ for commands, @ for context"
            class="relative block w-full bg-transparent text-sm text-transparent placeholder-zinc-500 resize-none max-h-40 min-h-[48px] px-4 py-3 outline-none caret-zinc-100"
            rows="1"></textarea>
        </div>
        <div class="flex items-center justify-between mt-2 px-1">
          <span class="text-[14px] text-zinc-500 hidden sm:block">Shift+Enter newline</span>
          <span class="text-[14px] text-zinc-500 sm:hidden">Shift+Enter newline</span>
          <span class="flex-1"></span>
          <span v-if="store.sessionTokens > 0" class="text-[11px] text-zinc-500 tabular-nums mr-3">{{ formatTokens(store.sessionTokens) }} tok</span>
          <button type="button" v-if="store.isBusy" @click="store.sendCancel()"
            class="w-8 h-8 flex items-center justify-center rounded-lg bg-red-600 hover:bg-red-500 transition-colors">
            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
          </button>
          <button type="submit" v-else :disabled="!store.connected || !input.trim()"
            class="w-8 h-8 flex items-center justify-center rounded-lg transition-colors"
            :class="store.connected && input.trim() ? 'bg-sky-600 hover:bg-sky-500' : 'bg-zinc-700 text-zinc-500 cursor-not-allowed'">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
          </button>
        </div>
        <!-- Slash dropdown -->
        <div v-if="slashOpen" class="absolute bottom-full left-0 right-0 mb-1 rounded-xl border border-zinc-700/80 bg-zinc-900/95 shadow-xl shadow-black/40 z-20 overflow-hidden">
          <button v-for="(cmd, i) in slashCommands" :key="cmd.command" @mousedown.prevent="selectSlash(cmd)"
            class="w-full text-left px-3 py-2 flex items-center gap-3 transition-colors"
            :class="i === slashIndex ? 'bg-zinc-800' : 'hover:bg-zinc-800/50'">
            <span class="font-mono text-xs text-sky-400">{{ cmd.command }}</span>
            <span class="text-xs text-zinc-500">{{ cmd.desc }}</span>
          </button>
        </div>
        <!-- File mention dropdown -->
        <div v-if="atOpen" class="file-dropdown absolute bottom-full left-0 right-0 mb-1 rounded-xl border border-zinc-700/80 bg-zinc-900/95 shadow-xl shadow-black/40 z-20 max-h-48 overflow-y-auto overflow-hidden">
          <button v-for="(fp, i) in filteredFiles" :key="fp" @mousedown.prevent="insertFile(fp)"
            class="w-full text-left px-3 py-2 text-xs transition-colors"
            :class="i === fileIndex ? 'bg-zinc-800 file-active' : 'hover:bg-zinc-800/50'">
            {{ fp }}
          </button>
        </div>
      </form>
    </div>
  </div>
</template>
